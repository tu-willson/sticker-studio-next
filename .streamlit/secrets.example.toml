# Copy the names below into Streamlit Community Cloud's Advanced settings, or
# into a local .streamlit/secrets.toml.  Do not commit the real file.
#
# These values must belong to the NEW Sticker Studio Next Supabase project.
SUPABASE_URL = "https://your-new-project.supabase.co"
SUPABASE_ANON_KEY = "your-new-project-anon-key"

# Optional: set this only for another deployment origin, such as the Cloud Run
# test service.  Community Cloud continues to use its built-in site URL.
# SITE_URL = "https://your-cloud-run-service.run.app"

# Add this only when member-credit image generation is implemented.  It stays
# server-side in Streamlit and must never be exposed to browser JavaScript.
# OPENAI_API_KEY = "sk-..."
