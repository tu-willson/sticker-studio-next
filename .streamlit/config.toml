[theme]
# Keep the studio controls consistent when visitors choose light, dark, or system mode.
base = "dark"
primaryColor = "#ff5c7a"
backgroundColor = "#151d2b"
secondaryBackgroundColor = "#242d3d"
textColor = "#eef2f7"
borderColor = "#465369"
showWidgetBorder = true

[theme.light]
backgroundColor = "#151d2b"
secondaryBackgroundColor = "#242d3d"
textColor = "#eef2f7"
borderColor = "#465369"

[theme.dark]
backgroundColor = "#151d2b"
secondaryBackgroundColor = "#242d3d"
textColor = "#eef2f7"
borderColor = "#465369"

[server]
enableStaticServing = true
