name: Deploy NewebPay Edge Functions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy formal NewebPay callbacks
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: iffmdhpqbezdrunwoxyh
    steps:
      - name: Check out the approved source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Deploy NewebPay functions
        run: |
          supabase functions deploy newebpay-checkout --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api --yes
          supabase functions deploy newebpay-notify --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api --yes
          supabase functions deploy newebpay-return --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api --yes
          supabase functions deploy newebpay-periodic-notify --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api --yes
          supabase functions deploy newebpay-periodic-return --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api --yes
