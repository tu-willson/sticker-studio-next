name: Initialize Performance Lab Database

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: "Type kvistqhcphsalxdlnhxw to confirm the isolated performance-lab database"
        required: true
        type: string
  push:
    branches:
      - perf-lab
    paths:
      - .perf-lab/initialize-database

permissions:
  contents: read

jobs:
  migrate:
    name: Apply schema only to Performance Lab
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.confirm_project_ref == 'kvistqhcphsalxdlnhxw') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/perf-lab')
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.PERF_LAB_DB_PASSWORD }}
      PERF_LAB_PROJECT_REF: kvistqhcphsalxdlnhxw
      PGHOST: aws-0-ap-southeast-2.pooler.supabase.com
      PGPORT: "5432"
      PGUSER: postgres.kvistqhcphsalxdlnhxw
      PGDATABASE: postgres
      PGSSLMODE: require
    steps:
      - name: Check out performance-lab source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate isolated target
        shell: bash
        run: |
          test -n "$SUPABASE_DB_PASSWORD" || {
            echo "Missing PERF_LAB_DB_PASSWORD repository secret." >&2
            exit 1
          }
      - name: Verify isolated database connection
        env:
          PGPASSWORD: ${{ secrets.PERF_LAB_DB_PASSWORD }}
        run: psql -w -v ON_ERROR_STOP=1 -c "select current_database(), current_user"

      - name: Preview pending migrations
        run: |
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort

      - name: Apply pending migrations
        env:
          PGPASSWORD: ${{ secrets.PERF_LAB_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          psql -w -v ON_ERROR_STOP=1 -c 'create schema if not exists perf_lab_meta'
          psql -w -v ON_ERROR_STOP=1 -c '
            create table if not exists perf_lab_meta.migration_history (
              filename text primary key,
              applied_at timestamptz not null default now()
            )
          '
          while IFS= read -r migration; do
            filename="$(basename "$migration")"
            already_applied="$(psql -w -Atqc "select 1 from perf_lab_meta.migration_history where filename = '$filename'" || true)"
            if [[ "$already_applied" == "1" ]]; then
              echo "Skipping already applied migration: $filename"
              continue
            fi
            echo "Applying migration: $filename"
            psql -w -v ON_ERROR_STOP=1 --single-transaction -f "$migration"
            psql -w -v ON_ERROR_STOP=1 -c "insert into perf_lab_meta.migration_history (filename) values ('$filename')"
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)
