name: Initialize Performance Lab Database

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: "Type kvistqhcphsalxdlnhxw to confirm the isolated performance-lab database"
        required: true
        type: string
  push:
    branches:
      - perf-lab
    paths:
      - .perf-lab/initialize-database

permissions:
  contents: read

jobs:
  migrate:
    name: Apply schema only to Performance Lab
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.confirm_project_ref == 'kvistqhcphsalxdlnhxw') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/perf-lab')
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.PERF_LAB_DB_PASSWORD }}
      PERF_LAB_PROJECT_REF: kvistqhcphsalxdlnhxw
    steps:
      - name: Check out performance-lab source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate isolated target
        shell: bash
        run: |
          test -n "$SUPABASE_DB_PASSWORD" || {
            echo "Missing PERF_LAB_DB_PASSWORD repository secret." >&2
            exit 1
          }
          python - <<'PY'
          import os
          from urllib.parse import quote

          password = os.environ["SUPABASE_DB_PASSWORD"]
          project_ref = os.environ["PERF_LAB_PROJECT_REF"]
          # This project is in ap-southeast-2. Construct the Session pooler
          # URI here so user-entered connection strings cannot be malformed.
          remote_url = (
              f"postgresql://postgres.{project_ref}:{quote(password, safe='')}"
              "@aws-0-ap-southeast-2.pooler.supabase.com:5432/postgres?sslmode=require"
          )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"PERF_LAB_REMOTE_URL={remote_url}\\n")
          PY

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Preview pending migrations
        run: supabase db push --yes --remote="$PERF_LAB_REMOTE_URL" --dry-run

      - name: Apply pending migrations
        run: supabase db push --yes --remote="$PERF_LAB_REMOTE_URL"
